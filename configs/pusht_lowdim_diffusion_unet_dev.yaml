experiment:
  name: pusht_lowdim_diffusion_unet_dev
  output_dir: outputs/pusht_lowdim_diffusion_unet_dev

seed: 42

dataset:
  name: pusht_lowdim
  path: data/pusht/pusht_cchi_v7_replay.zarr
  horizon: 16
  n_obs_steps: 2
  n_action_steps: 8
  val_ratio: 0.02
  max_train_episodes: 32
  max_train_windows: 4096
  max_val_windows: 256

model:
  type: diffusion_unet_lowdim
  diffusion_step_embed_dim: 128
  down_dims: [64, 128, 256]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  diffusion_steps: 20
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: true

training:
  batch_size: 128
  epochs: 10
  lr: 0.0001
  weight_decay: 0.000001
  device: auto
  log_interval: 1
  monitor_metric: exec_action_mse
  monitor_mode: min
  use_ema: true
  ema:
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

evaluation:
  batch_size: 128
  samples_per_observation: 1
  deterministic_sampling: true
  oa_step_convention: true
