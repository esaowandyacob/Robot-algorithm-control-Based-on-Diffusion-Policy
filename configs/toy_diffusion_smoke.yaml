experiment:
  name: toy_diffusion_smoke
  output_dir: outputs/toy_diffusion_smoke

seed: 42

dataset:
  name: toy_multimodal
  num_train: 1024
  num_val: 128
  horizon: 24
  obstacle_radius: 0.35
  obstacle_margin: 0.48
  curvature_jitter: 0.18
  start_y: -1.2
  goal_y: 1.2

model:
  type: diffusion
  hidden_dim: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  diffusion_steps: 12
  beta_start: 0.0001
  beta_end: 0.02

training:
  batch_size: 128
  epochs: 3
  lr: 0.001
  weight_decay: 0.0001
  device: auto
  log_interval: 1

evaluation:
  batch_size: 128
  distance_threshold: 0.12
  collision_margin: 0.0
  samples_per_observation: 2
  deterministic_sampling: false
